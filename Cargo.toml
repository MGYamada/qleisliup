[package]
name = "qleisliup"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MGYamada/qleisliup"
documentation = "https://github.com/MGYamada/qleisliup/blob/main/README.md"
description = "Explicit, authenticated Qleisli toolchain lifecycle management"
readme = "README.md"
keywords = ["qleisli", "toolchain", "cli", "tuf"]
categories = ["command-line-utilities", "development-tools"]
default-run = "qleisliup"
publish = ["crates-io"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/AGENTS.md",
    "/src/**",
    "/tests/**",
    "/scripts/check_cli.sh",
    "/scripts/check_cargo_free.sh",
    "/scripts/without_developer_tools.sh",
    "/scripts/check_runtime_guard.sh",
    "/docs/**",
]

[dependencies]
async-trait = "=0.1.92"
futures-util = "=0.3.31"
jiff = "=0.2.37"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
sha2 = "=0.10.9"
tar = { version = "=0.4.45", default-features = false }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "fs", "io-util", "time"] }
tough = { version = "=0.24.0", features = ["http"] }
tempfile = "=3.23.0"
url = "=2.5.7"
zstd = { version = "=0.13.3", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["process"] }
rustix = { version = "=1.1.3", features = ["fs", "process"] }

[dev-dependencies]
aws-lc-rs = "=1.18.1"
olpc-cjson = "=0.1.4"

[[bin]]
name = "qleisliup"
path = "src/main.rs"

[[bin]]
name = "qleisliup-init"
path = "src/init.rs"

[lints.rust]
unsafe_code = "forbid"
